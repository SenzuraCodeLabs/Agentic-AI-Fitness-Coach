[project]
name = "fitcoach"
version = "0.1.0"
description = "FitCoach - multi-agent AI fitness coaching system (SLIIT IT3041)"
requires-python = ">=3.13"

# Base dependencies shared by every service. Service-specific heavy
# dependencies live in the optional groups below so a single service can be
# installed without pulling the full ML stack.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "structlog>=25.1",
    "motor>=3.7",
    "pymongo>=4.10",
]

[project.optional-dependencies]
gateway = [
    "python-jose[cryptography]>=3.4",
    "argon2-cffi>=23.1",
    "aiosmtplib>=4.0",
    "email-validator>=2.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "apscheduler>=3.11",
]
gatekeeper = [
    "spacy>=3.8",
    "pyahocorasick>=2.1",
    "rapidfuzz>=3.12",
    "sentence-transformers>=3.4",
    "pyyaml>=6.0",
    "openai>=1.60",
]
researcher = [
    "chromadb>=0.6",
    "sentence-transformers>=3.4",
    "openai>=1.60",
]
coach = [
    "openai>=1.60",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "services*", "eval*"]
exclude = ["web*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "web", "chroma_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"eval/**" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["*/tests/*", "*/.venv/*"]
