name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gateway,gatekeeper,dev]"
          python -m spacy download en_core_web_sm

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        env:
          # CI-only throwaway values. Real secrets live in repository secrets.
          DEEPSEEK_API_KEY: sk-ci-placeholder
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: fitcoach_ci
          JWT_SECRET: ci-jwt-secret-value-not-used-in-prod
          AGENT_SHARED_SECRET: ci-agent-secret-value-not-used-in-prod
        run: pytest -q
